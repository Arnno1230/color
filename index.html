<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>কালার রিকুয়েস্ট · বর্ধিত</title>
  <script src="jspdf.umd.min.js"></script>
  <script src="jspdf.plugin.autotable.min.js"></script>
  <script src="notosansbengali-font.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'Noto Sans Bengali', system-ui, sans-serif;
      background: #f0f6f4;
      padding: 20px 12px 40px;
      display: flex;
      justify-content: center;
    }

    .app {
      max-width: 500px;
      width: 100%;
    }

    /* --- হেডার (সবুজ) --- */
    .header-green {
      background: linear-gradient(145deg, #0f6e5c, #12a37f);
      color: white;
      padding: 28px 18px 20px;
      border-radius: 28px 28px 24px 24px;
      box-shadow: 0 8px 20px rgba(15, 110, 92, 0.25);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .header-green h1 {
      font-size: 28px;      /* বড় ফন্ট */
      font-weight: 800;
      letter-spacing: 0.5px;
      margin: 0 0 4px;
    }

    .header-green .sub {
      font-size: 14px;
      opacity: 0.92;
      font-weight: 500;
    }

    .header-green::after {
      content: "🎨";
      position: absolute;
      right: 16px;
      bottom: 12px;
      font-size: 44px;
      opacity: 0.25;
    }

    /* --- কার্ড --- */
    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 16px 20px;
      box-shadow: 0 4px 16px rgba(0, 20, 16, 0.06);
      margin-bottom: 20px;
      border: 1px solid #e2eee9;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #2b4a42;
      margin-bottom: 4px;
      display: block;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #d0ddd8;
      border-radius: 14px;
      font-size: 15px;
      background: #fafdfc;
      transition: 0.2s;
      font-family: inherit;
    }

    input:focus {
      border-color: #12a37f;
      outline: none;
      box-shadow: 0 0 0 4px rgba(18, 163, 127, 0.12);
    }

    .row-duo {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .row-duo .grow { flex: 2; }
    .row-duo .shrink { flex: 1; }

    /* --- লাল বক্স (তারিখ) + নিচের লাল বক্স (total) --- */
    .red-box-group {
      display: flex;
      gap: 12px;
      align-items: stretch;
      margin-top: 12px;
    }

    .red-box {
      background: #ffe6e6;
      border: 1.5px solid #e5484d;
      border-radius: 16px;
      padding: 8px 12px;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 52px;
    }

    .red-box .label {
      font-weight: 700;
      color: #a13033;
      font-size: 13px;
      white-space: nowrap;
    }

    .red-box input {
      background: transparent;
      border: none;
      padding: 4px 0;
      font-weight: 600;
      color: #4a1e1f;
      font-size: 15px;
      width: 100%;
    }

    .red-box input:focus {
      box-shadow: none;
      background: rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      padding-left: 6px;
    }

    /* মোট পরিমাণও লাল বক্সে দেখাবো */
    .red-box .total-value {
      font-weight: 800;
      font-size: 18px;
      color: #b13a3e;
      padding: 0 2px;
    }

    /* --- স্প্রেডশীট --- */
    .sheet-wrap {
      border-radius: 16px;
      border: 1px solid #cbdad4;
      overflow-x: auto;
      margin: 8px 0 12px;
    }

    table.sheet {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    table.sheet th {
      background: #e6f3ef;
      color: #0f5f4f;
      font-size: 12px;
      font-weight: 700;
      padding: 10px 4px;
      border: 1px solid #bed3cb;
      text-align: center;
    }

    table.sheet td {
      border: 1px solid #bed3cb;
      padding: 0;
      vertical-align: middle;
    }

    table.sheet td.sl {
      background: #f4f9f7;
      color: #3b6b5e;
      font-size: 13px;
      font-weight: 600;
      width: 28px;
      padding: 6px 0;
      text-align: center;
    }

    table.sheet td input {
      width: 100%;
      border: none;
      background: transparent;
      padding: 10px 6px;
      font-size: 14px;
      text-align: center;
      font-family: inherit;
    }

    table.sheet td.col-name input {
      text-align: left;
      padding-left: 10px;
    }

    table.sheet td input:focus {
      background: #eaf7f2;
      outline: none;
    }

    .del-btn {
      background: none;
      border: none;
      color: #c0392b;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      padding: 6px 8px;
      width: 100%;
      transition: 0.1s;
    }

    .del-btn:hover { background: #fee8e6; border-radius: 8px; }

    .add-row-btn {
      width: 100%;
      padding: 12px;
      border: 2px dashed #12a37f;
      background: #f2fbf8;
      color: #0f6e5c;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-row-btn:hover { background: #e3f6f0; }

    /* PDF বাটন (হলুদ → বেগুনি সমান) */
    /* আসল হলুদ বক্সটি বাদ, বেগুনি বক্স তৈরি */
    .pdf-btn {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      border: none;
      border-radius: 40px;
      background: #7c3aed;   /* বেগুনি */
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(124, 58, 237, 0.35);
      transition: 0.15s;
      letter-spacing: 0.3px;
    }

    .pdf-btn:active { transform: scale(0.97); }

    /* খালি জায়গা */
    .empty-note { color: #77928a; font-size: 13px; text-align: center; padding: 6px; }

    /* কোন বেগুনি বক্স আলাদা নেই – তবে PDF বাটনই বেগুনি */
    /* আর হলুদ বক্সটি সরানো হয়েছে */

    /* স্পেস */
    .mt-1 { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="app">

    <!-- হেডার: সবুজ, বড় ফন্ট -->
    <div class="header-green">
      <h1>🎨 কালার রিকুয়েস্ট</h1>
      <div class="sub">Developed by Hridoy</div>
    </div>

    <!-- কার্ড: দোকান, ঠিকানা, ফোন -->
    <div class="card">
      <div>
        <label class="field-label">দোকান / ফ্যাক্টরির নাম</label>
        <input type="text" id="colorShopName" placeholder="দোকান বা ফ্যাক্টরির নাম লিখুন">
      </div>

      <div class="row-duo">
        <div class="grow">
          <label class="field-label">ঠিকানা</label>
          <input type="text" id="colorAddress" placeholder="ঠিকানা">
        </div>
        <div class="shrink">
          <label class="field-label">ফোন</label>
          <input type="text" id="colorPhone" placeholder="নম্বর">
        </div>
      </div>

      <!-- লাল বক্স : তারিখ (উপরের লাল) + নিচের লাল বক্স (মোট পরিমাণ) একসাথে -->
      <div class="red-box-group">
        <!-- তারিখ বক্স (লাল) -->
        <div class="red-box">
          <span class="label">📅 তারিখ</span>
          <input type="date" id="colorDate">
        </div>
        <!-- মোট পরিমাণ বক্স (লাল) – এখানে টোটাল দেখাবে -->
        <div class="red-box" id="totalRedBox">
          <span class="label">📦 মোট</span>
          <span class="total-value" id="totalDisplay">০</span>
        </div>
      </div>
    </div>

    <!-- কালারের তালিকা কার্ড -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <span style="font-weight: 700; color: #0f6e5c; font-size: 16px;">📋 কালারের তালিকা</span>
      </div>

      <div class="sheet-wrap">
        <table class="sheet">
          <thead>
            <tr>
              <th style="width:28px;">নং</th>
              <th style="text-align:left;">কালারের নাম</th>
              <th style="width:70px;">পরিমাণ</th>
              <th style="width:28px;"></th>
            </tr>
          </thead>
          <tbody id="colorRows"></tbody>
        </table>
      </div>

      <button class="add-row-btn" onclick="addColorRow()">+ নতুন লাইন যোগ করুন</button>

      <!-- PDF বাটন : বেগুনি (হলুদ বক্স নেই, বেগুনি সমান) -->
      <button class="pdf-btn" onclick="downloadColorPDF()">📄 পিডিএফ ডাউনলোড করুন</button>
    </div>

  </div>

  <script>
    const { jsPDF } = window.jspdf;

    /* ---------- date default ---------- */
    function todayStr() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }
    document.getElementById('colorDate').value = todayStr();

    /* ---------- color rows ---------- */
    let colorRowCount = 0;

    function addColorRow(name = '', qty = '') {
      colorRowCount++;
      const tbody = document.getElementById('colorRows');
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="sl">${colorRowCount}</td>
        <td class="col-name"><input type="text" placeholder="কালারের নাম" value="${name}"></td>
        <td><input type="number" step="any" placeholder="০" value="${qty}" oninput="calcTotals()"></td>
        <td><button class="del-btn" onclick="removeRow(this)">✕</button></td>
      `;
      tbody.appendChild(tr);
      calcTotals();
    }

    function removeRow(btn) {
      const tr = btn.closest('tr');
      tr.remove();
      const rows = document.querySelectorAll('#colorRows tr');
      rows.forEach((r, i) => { r.querySelector('.sl').innerText = i + 1; });
      colorRowCount = rows.length;
      calcTotals();
    }

    /* ---------- টোটাল ক্যালকুলেশন + লাল বক্স আপডেট ---------- */
    function calcTotals() {
      const rows = document.querySelectorAll('#colorRows tr');
      let totalQty = 0;
      rows.forEach(r => {
        const inp = r.querySelector('input[type=number]');
        if (inp) totalQty += parseFloat(inp.value) || 0;
      });

      const totalDisplay = document.getElementById('totalDisplay');
      if (totalQty <= 0) {
        totalDisplay.innerText = '০';
      } else {
        totalDisplay.innerText = totalQty;
      }
    }

    /* ---------- PDF (বাংলা ফন্ট সহ) ---------- */
    function downloadColorPDF() {
      const shop = document.getElementById('colorShopName').value || '-';
      const address = document.getElementById('colorAddress').value || '';
      const phone = document.getElementById('colorPhone').value || '';
      const date = document.getElementById('colorDate').value || todayStr();

      const rowEls = document.querySelectorAll('#colorRows tr');
      const rows = [];
      rowEls.forEach(r => {
        const nameInput = r.querySelector('.col-name input');
        const qtyInput = r.querySelector('input[type=number]');
        rows.push([nameInput.value || '-', qtyInput.value || '0']);
      });

      if (rows.length === 0) { alert('অন্তত একটি কালার লাইন যোগ করুন'); return; }

      const doc = new jsPDF();

      // বাংলা ফন্ট এম্বেড
      doc.addFileToVFS('NotoSansBengali-Regular.ttf', NOTO_BENGALI_TTF_BASE64);
      doc.addFont('NotoSansBengali-Regular.ttf', 'NotoBengali', 'normal');
      doc.setFont('NotoBengali');

      const marginX = 14;

      doc.setFontSize(20);
      doc.text(shop, marginX, 18);

      let subY = 28;
      if (address) {
        doc.setFontSize(10);
        doc.text(address, marginX, subY);
        subY += 6;
      }
      if (phone) {
        doc.setFontSize(10);
        doc.text('Phone: ' + phone, marginX, subY);
        subY += 6;
      }
      doc.setFontSize(12);
      doc.text('Color Order Request', marginX, subY);
      subY += 8;

      doc.autoTable({
        startY: subY,
        head: [['Color Name', 'Quantity']],
        body: rows,
        theme: 'grid',
        headStyles: { fillColor: [15, 110, 92], font: 'NotoBengali' },
        styles: { fontSize: 10, minCellHeight: 9, font: 'NotoBengali' }
      });

      let y = doc.lastAutoTable.finalY + 8;
      doc.setFontSize(11);

      const totalQty = rows.reduce((sum, r) => sum + (parseFloat(r[1]) || 0), 0);
      if (totalQty > 0) {
        doc.text(`Total Quantity: ${totalQty}`, marginX, y);
        y += 6;
      }

      y += 6;
      doc.setFontSize(10);
      doc.text('Date: ' + date, marginX, y);

      const fileName = 'color-order-' + date + '.pdf';
      savePdfSmart(doc, fileName);
    }

    function savePdfSmart(doc, fileName) {
      if (window.AndroidPDF && typeof window.AndroidPDF.savePdf === 'function') {
        const base64 = doc.output('datauristring').split(',')[1];
        window.AndroidPDF.savePdf(base64, fileName);
      } else {
        doc.save(fileName);
      }
    }

    /* ---------- init : ৪টি সারি ---------- */
    for (let i = 0; i < 4; i++) addColorRow();
  </script>

</body>
</html>
